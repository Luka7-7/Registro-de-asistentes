<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Congreso</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <div class="container">
    <img src="https://th.bing.com/th/id/OIP.JK3i0E2rzysKz3YOXnkdAAHaCB?r=0&o=7rm=3&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Logo del Congreso" class="logo">
    
    <h2>Registro Congreso Del Área de Ciencias Económicas y Administrativas</h2>
    
    <form id="registroForm">
      
      <div class="form-group">
        <label for="nombre">Nombre(s)</label>
        <input type="text" id="nombre" name="nombre" required placeholder="Ej. Daniel Alberto">
      </div>

      <div class="form-group">
        <label for="apellidos">Apellido(s)</label>
        <input type="text" id="apellidos" name="apellidos" required placeholder="Ej. Pérez García">
      </div>

      <!-- Tipo de Participante -->
      <div class="form-group">
        <label for="tipoParticipante">Tipo de Participante</label>
        <select id="tipoParticipante" name="tipoParticipante" required>
          <option value="">-- Selecciona una opción --</option>
          <option value="Alumno">Alumno</option>
          <option value="Docente">Docente</option>
        </select>
      </div>

      <!-- Rol en el Evento -->
      <div class="form-group">
        <label for="rol">Rol en el Evento</label>
        <select id="rol" name="rol" required>
          <option value="">-- Selecciona su rol --</option>
          <option value="Asistente">Asistente</option>
          <option value="Ponente">Ponente</option>
        </select>
      </div>


      <div class="form-group">
        <label for="matricula">Matrícula o Número de Trabajador</label>
        <input type="text" id="matricula" name="matricula" required placeholder="Ej. 20232345">
      </div>

      <div class="form-group">
        <label for="correo">Correo Electrónico</label>
        <input type="email" id="correo" name="correo" required placeholder="correo@ejemplo.com">
      </div>

      <div class="form-group">
        <label for="genero">Género</label>
        <select id="genero" name="genero" required>
          <option value="">-- Selecciona un género --</option>
          <option value="Masculino">Masculino</option>
          <option value="Femenino">Femenino</option>
          <option value="Otro">Prefiero no decirlo</option>
        </select>
      </div>

      <div class="form-group">
        <label for="facultad">Facultad:</label>
        <select id="facultad" name="facultad" required>
          <option value="">-- Selecciona una facultad --</option>
          <option value="Economía">Economía</option>
          <option value="UACYA">UACYA</option>
          <option value="Turismo y Gastronomía">Turismo y Gastronomía</option>
        </select>
      </div>

      <div class="form-group">
        <label for="carrera">Carrera / Licenciatura:</label>
        <select id="carrera" name="carrera" required disabled>
          <option value="">-- Primero selecciona una facultad --</option>
        </select>
      </div>

      <div class="form-group">
        <label for="modalidad">Modalidad de la carrera</label>
        <select id="modalidad" name="modalidad" required>
          <option value="">-- Selecciona una modalidad --</option>
          <option value="Escolarizado">Escolarizado</option>
          <option value="Semiescolarizado">Semiescolarizado</option>
          <option value="En línea">En línea</option>
          <option value="Mixta">Mixta</option>
        </select>
      </div>

      <div class="form-group">
        <label for="conferencia">Selecciona la Conferencia/Taller</label>
        <select id="conferencia" name="conferencia" required>
          <option value="">-- Selecciona una conferencia/taller --</option>
          <!--Martes 6 de octubre-->
          <option value="Inauguración del Congreso">Inauguración del Congreso</option>
          <option value="Conferencia Magistral 'Decisión con Atajos Cognitivos: sin responsabilidad no hay paraíso'">Conferencia Magistral "Decisión con Atajos Cognitivos: sin responsabilidad no hay paraíso"</option>
          <option value="Conferencia 'Innovación para la sustentabilidad en el turismo'">Conferencia "Innovación para la sustentabilidad en el turismo"</option>
          <option value="Taller Mukimono (6 de octubre)">Taller Mukimono (6 de octubre)</option>
          <option value="Conferencia 'El atacante no fuerza la puerta. La abres tú: ciberseguridad para negocios y destinos turísticos'">Conferencia "El atacante no fuerza la puerta. La abres tú: ciberseguridad para negocios y destinos turísticos"</option>
          <option value="Conferencia 'Lengua de Señas Mexicanas en la formación profesional: comunicación, inclusión y servicio'">Conferencia "Lengua de Señas Mexicanas en la formación profesional: comunicación, inclusión y servicio"</option>
          <option value="Taller 'Horneando Ideas: Galleteria'">Taller "Horneando Ideas: Galleteria"</option>
          <option value="Conferencia 'No necesitamos menos IA'">Conferencia "No necesitamos menos IA"</option>
          <option value="Taller: 'Internet de las cosas'">Taller: "Internet de las cosas"</option>
          <!--Miercoles 7 de octubre-->
          <option value="Taller 'Horneando Ideas: Galletaria (7 de octubre)'">Taller "Horneando Ideas: Galletaria (7 de octubre)</option>
          <option value="Mesa de análisis 'En la mesa de emprendimiento, innovación y economia'">Mesa de análisis "En la mesa de emprendimiento, innovación y economia"</option>
          <option value="Conferencias 'De lo local a lo global: construye tu perfil profesional para un mercado sin fronteras'">Conferencias "De lo local a lo global: construye tu perfil profesional para un mercado sin fronteras"</option>
          <option value="Exposiciones alumnos">Exposiciones alumnos</option>
          <option value="Conferencia 'Gestión del patrimonio cultural como potencial producto turistico'">Conferencia "Gestión del patrimonio cultural como potencial producto turistico"</option>
          <option value="Conferencia 'Ética en la IA: oportunidades y amenazas actuales'">Conferencia "Ética en la IA: oportunidades y amenazas actuales"</option>
          <option value="Taller 'Blindando tu perimetro: taller práctico de ciberseguridad para negocios, turismo y territorio'">Taller "Blindando tu perimetro: taller práctico de ciberseguridad para negocios, turismo y territorio"</option>
          <option value="Taller 'Modelo de negocios con herramienta CANVAS'">Taller "Modelo  de negocios con herramienta CANVAS"</option>
          <option value="Evaluación de propuestas Concurso RECREA">Evaluación de propuestas Concurso RECREA</option>
          <option value="Premiación Concurso RECREA">Premiación Concurso RECREA</option>
          <option value="Taller básico de fotografia">Taller básico de fotografia</option>
          <option value="Taller Mukimono (7 de octubre)">Taller Mukimono (7 de octubre)</option>
          <option value="Taller 'Desarrollo de Simuladores y aplicaciones interactivas con IA'">Taller "Desarrollo de Simuladores y aplicaciones interactivas con IA"</option>
        </select>
      </div>

      <button type="submit" id="btnSubmit">Enviar Registro</button>
      <div id="statusMessage"></div>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
