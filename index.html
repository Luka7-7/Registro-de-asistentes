<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Congreso</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <div class="container">
    <img src="https://th.bing.com/th/id/OIP.JK3i0E2rzysKz3YOXnkdAAHaCB?r=0&o=7rm=3&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Logo del Congreso" class="logo">
    
    <h2>Registro Congreso Del Área de Ciencias Económicas y Administrativas</h2>
    
    <form id="registroForm">
      
      <div class="form-group">
        <label for="nombre">Nombre(s)</label>
        <input type="text" id="nombre" name="nombre" required placeholder="Ej. Daniel Alberto">
      </div>

      <div class="form-group">
        <label for="apellidos">Apellido(s)</label>
        <input type="text" id="apellidos" name="apellidos" required placeholder="Ej. Pérez García">
      </div>

      <!-- Tipo de Participante -->
      <div class="form-group">
        <label for="tipoParticipante">Tipo de Participante</label>
        <select id="tipoParticipante" name="tipoParticipante" required>
          <option value="">-- Selecciona una opción --</option>
          <option value="Alumno">Alumno</option>
          <option value="Docente">Docente</option>
        </select>
      </div>

      <!-- Rol en el Evento -->
      <div class="form-group">
        <label for="rol">Rol en el Evento</label>
        <select id="rol" name="rol" required>
          <option value="">-- Selecciona su rol --</option>
          <option value="Asistente">Asistente</option>
          <option value="Ponente">Ponente</option>
        </select>
      </div>


      <div class="form-group">
        <label for="matricula">Matrícula o Número de Trabajador</label>
        <input type="text" id="matricula" name="matricula" required placeholder="Ej. 20232345">
      </div>

      <div class="form-group">
        <label for="correo">Correo Electrónico</label>
        <input type="email" id="correo" name="correo" required placeholder="correo@ejemplo.com">
      </div>

      <div class="form-group">
        <label for="genero">Género</label>
        <select id="genero" name="genero" required>
          <option value="">-- Selecciona un género --</option>
          <option value="Masculino">Masculino</option>
          <option value="Femenino">Femenino</option>
          <option value="Otro">Prefiero no decirlo</option>
        </select>
      </div>

      <div class="form-group">
        <label for="facultad">Facultad:</label>
        <select id="facultad" name="facultad" required>
          <option value="">-- Selecciona una facultad --</option>
          <option value="Economía">Economía</option>
          <option value="UACYA">UACYA</option>
          <option value="Turismo y Gastronomía">Turismo y Gastronomía</option>
        </select>
      </div>

      <div class="form-group">
        <label for="carrera">Carrera / Licenciatura:</label>
        <select id="carrera" name="carrera" required disabled>
          <option value="">-- Primero selecciona una facultad --</option>
        </select>
      </div>

      <div class="form-group">
        <label for="modalidad">Modalidad de la carrera</label>
        <select id="modalidad" name="modalidad" required>
          <option value="">-- Selecciona una modalidad --</option>
          <option value="Escolarizado">Escolarizado</option>
          <option value="Semiescolarizado">Semiescolarizado</option>
          <option value="En línea">En línea</option>
        </select>
      </div>

      <div class="form-group">
        <label for="conferencia">Selecciona la Conferencia/Taller</label>
        <select id="conferencia" name="conferencia" required>
          <option value="">-- Selecciona una conferencia/taller --</option>
          <option value="INAUGURACION">Inauguración del Congreso</option>
          <option value="CONFERENCIA: DECISIONES CON ATAJOS COGNITIVOS">Conferencia Magistral "Decisión con Atajos Cognitivos: sin responsabilidad no hay paraíso"</option>
          <option value="CONFERENCIA: DRA. Lucia Gonzalez Torrero">Conferencia: DRA. Lucia Gonzalez Torrero</option>
          <option value="Taller Mukimono 6 de octubre">Taller: Mukimono 6 de octubre</option>
          <option value="CONFERENCIA: Gabriel Gonzalez Torrero">Conferencia: Gabriel Gonzalez Torrero</option>
          <option value="Conferencia: 'Turismo Inclusivo' MTRA Paty Robles">Conferencia: "Turismo Inclusivo" MTRA Paty Robles</option>
          <option value="Taller: Galletas 6 de octubre">Taller: Galletas 6 de octubre</option>
          <option value="Conferencia: 'No necesitamos menos IA' DR. Eligardo Cruz Sanchez">Conferencia: 'No necesitamos menos IA' DR. Eligardo Cruz Sanchez</option>
          <option value="Taller: 'Internet de las cosas' DR. RaudeL Lopéz Espinoza">Taller: 'Internet de las cosas' DR. RaudeL Lopéz Espinoza</option>
          <option value="Taller: Galletas 7  de octubre">Taller: Galletas 7  de octubre</option>
          <option value="Exposición alumnos">Exposición alumnos</option>
          <option value="Taller: 'Modelo de negocios con herramientas CANVA'">Taller: "Modelo de negocios con herramientas CANVA"</option>
          <option value="Taller mukimono 7 de octubre">Taller: Mukimono 7 de octubre</option>
          <option value="Taller: 'Desarrollo de simuladores y aplicaciones interactivas con IA' DR. Gabriel Zepeda Martinez">Taller: 'Desarrollo de simuladores y aplicaciones interactivas con IA' DR. Gabriel Zepeda Martinez</option>
        </select>
      </div>

      <button type="submit" id="btnSubmit">Enviar Registro</button>
      <div id="statusMessage"></div>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
